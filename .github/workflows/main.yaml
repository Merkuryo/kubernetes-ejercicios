name: Release application

on:
  push:
    paths:
      - 'ejercicio3_5/**'
      - '.github/workflows/main.yaml'

env:
  PROJECT_ID: ${{ secrets.GKE_PROJECT }}
  GKE_CLUSTER: dwk-cluster
  GKE_ZONE: europe-north1-b
  REGISTRY: europe-north1-docker.pkg.dev
  REPOSITORY: docker-repo
  IMAGE: dwk-environments
  SERVICE: dwk-environments
  BRANCH: ${{ github.ref_name }}

jobs:
  build-publish-deploy:
    name: Build, Publish and Deploy
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GKE_SA_KEY }}'
      
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
      
      - name: Use gcloud CLI
        run: gcloud info
      
      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet
      
      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: '${{ env.GKE_CLUSTER }}'
          project_id: '${{ env.PROJECT_ID }}'
          location: '${{ env.GKE_ZONE }}'
      
      - name: Form the image name
        run: echo "IMAGE_TAG=${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE }}:${{ env.BRANCH }}-${{ github.sha }}" >> $GITHUB_ENV
      
      - name: Build Docker image
        run: |
          cd ejercicio3_5
          docker build --tag ${{ env.IMAGE_TAG }} .
      
      - name: Publish image to Artifact Registry
        run: docker push ${{ env.IMAGE_TAG }}
      
      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v2.1.0
      
      - name: Determine namespace
        id: namespace
        run: |
          BRANCH=${{ github.ref_name }}
          if [ "$BRANCH" = "main" ]; then
            NAMESPACE=project
          else
            NAMESPACE=$BRANCH
          fi
          echo "NAMESPACE=$NAMESPACE" >> $GITHUB_OUTPUT
      
      - name: Deploy to GKE
        run: |
          NAMESPACE=${{ steps.namespace.outputs.NAMESPACE }}
          cd ejercicio3_5
          
          # Create namespace
          kubectl create namespace $NAMESPACE || true
          
          # Set context
          kubectl config set-context --current --namespace=$NAMESPACE
          
          # Update Kustomize with namespace and image
          kustomize edit set namespace $NAMESPACE
          kustomize edit set image PROJECT/IMAGE=${{ env.IMAGE_TAG }}
          
          # Apply manifests
          kustomize build . | kubectl apply -f -
          
          # Wait for rollout and display services
          kubectl rollout status deployment ${{ env.SERVICE }}
          kubectl get services -o wide
