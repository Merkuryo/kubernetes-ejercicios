apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dummysite-controller-role
rules:
# For reading/watching DummySite CRD
- apiGroups: ["stable.dwk"]
  resources: ["dummysites"]
  verbs: ["get", "list", "watch", "create", "delete"]

# For creating/managing Deployments
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list", "create", "update", "patch", "delete"]
  
# For creating/managing Services
- apiGroups: [""]
  resources: ["services"]
  verbs: ["get", "list", "create", "update", "patch", "delete"]

# For creating/managing ConfigMaps
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list", "create", "update", "patch", "delete"]

# For managing Pods (reading logs, deleting)
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "delete"]

# For reading namespaces
- apiGroups: [""]
  resources: ["namespaces"]
  verbs: ["get", "list"]
