apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: project
  name: todo-app-dep
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo-app
  template:
    metadata:
      labels:
        app: todo-app
    spec:
      containers:
      - name: todo-app
        image: todo-app-app:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 3000
        # Inyectar variables del ConfigMap
        envFrom:
        - configMapRef:
            name: project-config
---
apiVersion: v1
kind: Service
metadata:
  namespace: project
  name: todo-app-svc
spec:
  type: NodePort
  selector:
    app: todo-app
  ports:
  - protocol: TCP
    port: 3000
    targetPort: 3000
    nodePort: 30003
