apiVersion: v1
kind: Service
metadata:
  name: pingpong-svc
  namespace: readiness-probe
spec:
  type: ClusterIP
  selector:
    app: pingpong
  ports:
    - port: 3000
      targetPort: 3541
      protocol: TCP

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pingpong-dep
  namespace: readiness-probe
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pingpong
  template:
    metadata:
      labels:
        app: pingpong
    spec:
      containers:
        - name: pingpong
          image: mluukkai/dwk-app8:v1
          ports:
            - containerPort: 3541
          env:
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: postgres-config
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: postgres-config
                  key: DB_PORT
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: postgres-config
                  key: DB_NAME
            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: postgres-config
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                configMapKeyRef:
                  name: postgres-config
                  key: DB_PASSWORD
          # ReadinessProbe: Check if pod can connect to database
          # The endpoint /healthz returns 200 if DB is ready, 500 if not
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3541
            initialDelaySeconds: 10
            periodSeconds: 5
