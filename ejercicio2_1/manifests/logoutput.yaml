apiVersion: v1
kind: Service
metadata:
  namespace: exercises
  name: logoutput-svc
spec:
  type: NodePort
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30002
      protocol: TCP
  selector:
    app: logoutput
---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: exercises
  name: logoutput-dep
spec:
  replicas: 1
  selector:
    matchLabels:
      app: logoutput
  template:
    metadata:
      labels:
        app: logoutput
    spec:
      containers:
        - name: logoutput
          image: logoutput-app:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
