apiVersion: apps/v1
kind: Deployment
metadata:
  name: writer-dep
spec:
  replicas: 1
  selector:
    matchLabels:
      app: writer
  template:
    metadata:
      labels:
        app: writer
    spec:
      containers:
      - name: writer
        image: writer:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 3001
        volumeMounts:
        - name: shared-data
          mountPath: /usr/src/app/data
      volumes:
      - name: shared-data
        persistentVolumeClaim:
          claimName: data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: writer-svc
spec:
  type: NodePort
  selector:
    app: writer
  ports:
  - port: 3001
    targetPort: 3001
    nodePort: 30001
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: writer-ingress
spec:
  rules:
  - http:
      paths:
      - path: /writer
        pathType: Prefix
        backend:
          service:
            name: writer-svc
            port:
              number: 80