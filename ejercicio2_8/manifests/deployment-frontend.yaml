apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-app-db-dep
  namespace: project
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo-app-db
  template:
    metadata:
      labels:
        app: todo-app-db
    spec:
      containers:
      - name: todo-app
        image: todo-app-app:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 3000
        env:
        - name: TODOS_BACKEND
          value: "http://todo-backend-db-svc:3000"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: todo-app-db-svc
  namespace: project
spec:
  type: NodePort
  ports:
  - port: 3000
    targetPort: 3000
    nodePort: 30008
  selector:
    app: todo-app-db
