apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-backend-db-dep
  namespace: project
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo-backend-db
  template:
    metadata:
      labels:
        app: todo-backend-db
    spec:
      containers:
      - name: todo-backend
        image: todo-backend-app:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 3000
        envFrom:
        - configMapRef:
            name: todos-db-config
        - secretRef:
            name: todos-db-secret
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: todo-backend-db-svc
  namespace: project
spec:
  type: ClusterIP
  ports:
  - port: 3000
    targetPort: 3000
  selector:
    app: todo-backend-db
