# NATS Installation via Helm
# First, install NATS with Helm:
# helm repo add bitnami https://charts.bitnami.com/bitnami
# helm install my-nats bitnami/nats --set auth.enabled=false
#
# For metrics and monitoring:
# helm upgrade my-nats bitnami/nats -f nats-values.yaml
#
# where nats-values.yaml contains:
# auth:
#   enabled: false
# metrics:
#   enabled: true
#   serviceMonitor:
#     enabled: true
#     namespace: prometheus

---
# Backend Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-dep
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: todo-backend:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
          env:
            - name: NATS_URL
              value: nats://my-nats:4222
            - name: POSTGRES_HOST
              value: postgres
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              value: postgres
            - name: POSTGRES_DB
              value: postgres
            - name: POSTGRES_PORT
              value: "5432"
            - name: PORT
              value: "3000"
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector:
    app: backend
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
      protocol: TCP
