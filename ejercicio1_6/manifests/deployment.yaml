apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo-app
  template:
    metadata:
      labels:
        app: todo-app
    spec:
      containers:
      - name: todo-app
        image: merkuryom/todo-app:1.5
        env:
        - name: PORT
          value: "3000"
        - name: MESSAGE
          value: "Welcome to Todo App v1.5!"
