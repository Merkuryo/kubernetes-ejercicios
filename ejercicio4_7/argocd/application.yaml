apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: log-output-gitops
  namespace: argocd
spec:
  project: default
  
  source:
    repoURL: https://github.com/Merkuryo/kubernetes-ejercicios
    targetRevision: main
    path: ejercicio4_7/manifests
  
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
