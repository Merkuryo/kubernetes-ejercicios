name: Publish Log Output Application

on:
  push:
    branches:
      - main
    paths:
      - 'ejercicio4_7/**'

jobs:
  publish:
    name: Build, Push, and Update Kustomization
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: ./ejercicio4_7
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/log-output-gitops:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/log-output-gitops:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Update kustomization.yaml with new image
        run: |
          cd ${{ github.workspace }}/ejercicio4_7/manifests
          kustomize edit set image PROJECT/IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/log-output-gitops:${{ github.sha }}

      - name: Commit kustomization.yaml to GitHub
        uses: EndBug/add-and-commit@v9
        with:
          add: 'ejercicio4_7/manifests/kustomization.yaml'
          message: "Build ${{ github.sha }}: Update log-output image to ${{ secrets.DOCKERHUB_USERNAME }}/log-output-gitops:${{ github.sha }}"
          push: true
          author_name: "GitOps Bot"
          author_email: "gitops@kubernetes.local"
