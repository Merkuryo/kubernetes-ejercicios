---

apiVersion: v1
kind: ConfigMap
metadata:
  name: greeter-code
  namespace: default
data:
  app.js: |
    const express = require('express');
    const app = express();
    const PORT = 8080;
    const VERSION = process.env.VERSION || 'v1';
    const GREETINGS = {
      v1: ['Hello, World!', 'Hi there!', 'Welcome!', 'Good to see you!'],
      v2: ['Hola, Mundo!', '¡Hola!', '¡Bienvenido!', '¡Qué gusto verte!']
    };
    app.get('/health', (req, res) => {
      res.status(200).json({ 
        status: 'healthy',
        version: VERSION 
      });
    });
    app.get('/greeting', (req, res) => {
      const greetingList = GREETINGS[VERSION] || GREETINGS.v1;
      const greeting = greetingList[Math.floor(Math.random() * greetingList.length)];
      console.log(\`[\${VERSION}] Serving greeting: \${greeting}\`);
      res.json({ 
        greeting: greeting,
        version: VERSION,
        timestamp: new Date().toISOString()
      });
    });
    app.get('/version', (req, res) => {
      res.json({ version: VERSION });
    });
    app.listen(PORT, () => {
      console.log(\`Greeter \${VERSION} listening on port \${PORT}\`);
    });
  package.json: |
    {
      "name": "greeter",
      "version": "1.0.0",
      "description": "Greeter service for Istio canary deployment demo",
      "main": "app.js",
      "scripts": {
        "start": "node app.js",
        "dev": "nodemon app.js"
      },
      "keywords": ["kubernetes", "istio", "greeter"],
      "author": "",
      "license": "ISC",
      "dependencies": {
        "express": "^4.18.2"
      },
      "devDependencies": {
        "nodemon": "^3.0.1"
      }
    }

---

apiVersion: v1
kind: Service
metadata:
  name: greeter-svc-v1
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: greeter
    version: v1
  ports:
    - name: http
      port: 80
      protocol: TCP
      targetPort: 8080

---

