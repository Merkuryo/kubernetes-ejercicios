apiVersion: apps/v1
kind: Deployment
metadata:
  name: greeter-dep-v1
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: greeter
      version: v1
  template:
    metadata:
      labels:
        app: greeter
        version: v1
    spec:
      containers:
        - name: greeter
          image: node:18-alpine
          command:
            - sh
            - -c
            - |
              cd /app
              npm install
              npm start
          env:
            - name: VERSION
              value: "v1"
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: greeter-code
              mountPath: /app
      volumes:
        - name: greeter-code
          configMap:
            name: greeter-code
            defaultMode: 0755

---

apiVersion: apps/v1
kind: Deployment
