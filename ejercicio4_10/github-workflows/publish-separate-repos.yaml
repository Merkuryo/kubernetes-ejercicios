name: Publish The Project - Separate Config Repo

on:
  push:
    branches:
      - main
    paths:
      - 'ejercicio4_10/backend/**'
    tags:
      - 'stable'

env:
  REGISTRY: europe-north1-docker.pkg.dev
  PROJECT_ID: dwk-gke-477617
  DOCKER_REPO: docker-repo
  BACKEND_IMAGE_NAME: the-project-api
  # Config repository (separate from this app repo)
  CONFIG_REPO: kubernetes-ejercicios-config
  CONFIG_REPO_OWNER: Merkuryo

jobs:
  build-and-update-config:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout app repository
        uses: actions/checkout@v4
        with:
          path: app-repo

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for GCP
        run: |
          gcloud auth configure-docker ${{ env.REGISTRY }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./app-repo/ejercicio4_10/backend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.DOCKER_REPO }}/${{ env.BACKEND_IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Checkout config repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.CONFIG_REPO_OWNER }}/${{ env.CONFIG_REPO }}
          token: ${{ secrets.GITHUB_TOKEN }}
          path: config-repo

      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Update Staging Image (push to main)
        if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
        run: |
          cd config-repo/overlays/staging
          kustomize edit set image PROJECT/BACKEND=${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.DOCKER_REPO }}/${{ env.BACKEND_IMAGE_NAME }}:${{ github.sha }}
          
      - name: Update Production Image (push when tagged)
        if: startsWith(github.ref, 'refs/tags/stable')
        run: |
          cd config-repo/overlays/prod
          kustomize edit set image PROJECT/BACKEND=${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.DOCKER_REPO }}/${{ env.BACKEND_IMAGE_NAME }}:${{ github.sha }}

      - name: Commit and push to config repository
        working-directory: config-repo
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add overlays/
          git commit -m "ci: Update backend image to ${{ github.sha }}" || echo "No changes to commit"
          git push origin main

      - name: Summary
        run: |
          echo "✅ App Repository: kubernetes-ejercicios"
          echo "   - Built backend image"
          echo "   - Image: ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.DOCKER_REPO }}/${{ env.BACKEND_IMAGE_NAME }}:${{ github.sha }}"
          echo ""
          echo "✅ Config Repository: ${{ env.CONFIG_REPO_OWNER }}/${{ env.CONFIG_REPO }}"
          echo "   - Updated overlays with new image tag"
          echo "   - ArgoCD will detect and sync automatically"
