apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-output-dep
spec:
  replicas: 1
  selector:
    matchLabels:
      app: log-output
  template:
    metadata:
      labels:
        app: log-output
    spec:
      containers:
        - name: log-output
          image: mluukkai/dwk-app6-log-output:stable
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: log-output-svc
spec:
  type: LoadBalancer
  selector:
    app: log-output
  ports:
    - port: 8080
      targetPort: 8080
