name: Publish The Project (Multi-environment)

on:
  push:
    branches:
      - main
    paths:
      - 'ejercicio4_9/**'
    tags:
      - 'stable'

env:
  REGISTRY: europe-north1-docker.pkg.dev
  PROJECT_ID: dwk-gke-477617
  DOCKER_REPO: docker-repo
  BACKEND_IMAGE_NAME: the-project-api

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for GCP
        run: |
          gcloud auth configure-docker ${{ env.REGISTRY }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./ejercicio4_9/backend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.DOCKER_REPO }}/${{ env.BACKEND_IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Update Staging Image
        if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
        run: |
          cd ejercicio4_9/overlays/staging
          kustomize edit set image PROJECT/BACKEND=${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.DOCKER_REPO }}/${{ env.BACKEND_IMAGE_NAME }}:${{ github.sha }}
          
      - name: Update Production Image (when tagged)
        if: startsWith(github.ref, 'refs/tags/stable')
        run: |
          cd ejercicio4_9/overlays/prod
          kustomize edit set image PROJECT/BACKEND=${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.DOCKER_REPO }}/${{ env.BACKEND_IMAGE_NAME }}:${{ github.sha }}

      - name: Commit changes
        uses: EndBug/add-and-commit@v9
        with:
          author_name: GitHub Actions
          author_email: actions@github.com
          message: 'ci: Update image tags for environments'
          add: 'ejercicio4_9/overlays/'
          push: true
